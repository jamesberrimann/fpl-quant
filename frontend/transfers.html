<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer Suggestions — FPL Tool</title>
  <link rel="stylesheet" href="/style.css?v=2">
  <style>
    /* ── Transfer cards ─────────────────────── */
    .transfer-list {
      display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem;
    }

    .transfer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1.125rem 1.25rem;
      box-shadow: var(--sh-sm);
    }

    /* Top row: position badge + cost badge */
    .tc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.875rem;
    }

    /* Middle row: out shirt → in shirt */
    .tc-players {
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem;
    }

    .tc-side {
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; flex: 1; min-width: 0;
    }

    .tc-shirt { width: 48px; height: 53px; flex-shrink: 0; }
    .tc-shirt svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 5px rgba(0,0,0,.18)); }

    .tc-name {
      font-size: 0.8125rem; font-weight: 600;
      color: var(--text); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 120px;
    }

    .tc-arrow {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex-shrink: 0;
    }

    .tc-arrow svg {
      width: 24px; height: 24px;
      stroke: var(--primary); stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; fill: none;
    }

    .tc-improvement {
      font-size: 0.625rem; font-weight: 700;
      color: var(--success); white-space: nowrap;
    }

    /* Bottom: price change + timing warning */
    .tc-footer {
      display: flex; align-items: center; gap: 0.5rem;
      flex-wrap: wrap; margin-top: 0.875rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--text-muted);
    }

    .tc-price { font-weight: 500; }
    .tc-price.gain { color: var(--success); }
    .tc-price.loss { color: var(--error); }

    .tc-timing {
      display: flex; align-items: center; gap: 0.3rem;
      color: var(--warning); font-weight: 500;
      font-size: 0.75rem;
    }
    .tc-timing svg {
      width: 13px; height: 13px; flex-shrink: 0;
      stroke: var(--warning); stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    .badge-dgw {
      display: inline-flex; align-items: center;
      padding: 0.15rem 0.5rem; border-radius: 5px;
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em;
      background: #fef3c7; color: #92400e;
    }
    .badge-diff {
      display: inline-flex; align-items: center;
      padding: 0.15rem 0.5rem; border-radius: 5px;
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em;
      background: #ede9fe; color: #5b21b6;
    }
    .tc-ownership {
      font-size: 0.625rem; color: var(--text-muted);
      text-align: center; white-space: nowrap;
    }

    .price-arrow {
      display: inline-flex; align-items: center; gap: 0.2rem;
      font-size: 0.6875rem; font-weight: 700; line-height: 1;
    }
    .price-arrow.rising  { color: var(--success); }
    .price-arrow.falling { color: var(--error); }
    .price-arrow svg { flex-shrink: 0; }

    .badge-rotation {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15rem 0.5rem; border-radius: 5px;
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em;
      background: #fce7f3; color: #9d174d;
    }
    .badge-rotation svg {
      width: 11px; height: 11px; flex-shrink: 0;
      stroke: #9d174d; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    .badge-hot-form {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15rem 0.5rem; border-radius: 5px;
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em;
      background: #fff7ed; color: #c2410c;
    }
    .badge-hot-form svg { stroke: #c2410c; flex-shrink: 0; }

    .ownership-trend {
      font-size: 0.6875rem; font-weight: 600;
    }
    .ownership-trend.rising { color: var(--success); }
    .ownership-trend.falling { color: var(--error); }

    .break-even {
      font-size: 0.6875rem; color: var(--text-muted);
    }
    .driver-tag {
      display: inline-flex; align-items: center;
      padding: 0.1rem 0.45rem; border-radius: 4px;
      font-size: 0.625rem; font-weight: 600;
      background: #eff6ff; color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    .driver-tag.injury {
      background: #fef2f2; color: #991b1b;
      border-color: #fecaca;
    }
    .driver-tag.doubtful {
      background: #fff7ed; color: #c2410c;
      border-color: #fed7aa;
    }
    .driver-tag.concern {
      background: #fefce8; color: #854d0e;
      border-color: #fde68a;
    }

    /* Cost badges */
    .badge-free-lg {
      display: inline-flex; align-items: center;
      padding: 0.225rem 0.65rem; border-radius: 6px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em;
      background: var(--success-bg); color: var(--success);
    }
    .badge-hit-lg {
      display: inline-flex; align-items: center;
      padding: 0.225rem 0.65rem; border-radius: 6px;
      font-size: 0.75rem; font-weight: 700;
      background: var(--error-bg); color: var(--error);
    }

    @media (max-width: 480px) {
      .tc-name { max-width: 90px; font-size: 0.75rem; }
      .tc-shirt { width: 40px; height: 44px; }
    }
  </style>
</head>
<body>
  <script src="/nav.js"></script>
  <script src="/kits.js?v=5"></script>
  <div class="container">
    <h1>Transfer Suggestions</h1>

    <div class="controls">
      <label>Entry ID
        <input type="number" id="entry-id" placeholder="e.g. 1234567">
      </label>
      <label>Free transfers
        <input type="number" id="free-transfers" value="1" min="0" style="width:70px">
      </label>
      <button id="run-btn" onclick="run()">Suggest Transfers</button>
    </div>

    <p class="msg msg-error" id="error"></p>
    <div class="loading" id="loading"><div class="spinner"></div>Loading…</div>

    <div id="results" style="display:none">
      <div id="roll-banner" style="display:none;margin-bottom:1rem;padding:0.75rem 1rem;background:var(--surface);border:1.5px solid var(--warning,#f59e0b);border-radius:var(--r-lg);font-size:0.875rem;color:var(--text)">
        <span style="font-weight:700;margin-right:0.4rem">↩ Roll your transfer —</span><span id="roll-message"></span>
      </div>
      <div class="transfer-list" id="transfer-list"></div>
    </div>
  </div>

  <script>
    const { teamColours, abbr, shirtSvg } = FPLKits;

    window.addEventListener('DOMContentLoaded', () => {
      const saved = FPL.getEntryId();
      if (saved) document.getElementById('entry-id').value = saved;
      document.getElementById('entry-id').addEventListener('change', () =>
        FPL.setEntryId(document.getElementById('entry-id').value));
    });

    function priceHtml(change) {
      if (Math.abs(change) < 0.05) return `<span class="tc-price">No price change</span>`;
      const sign = change > 0 ? '+' : '−';
      const cls  = change > 0 ? 'gain' : 'loss';
      return `<span class="tc-price ${cls}">${sign}£${Math.abs(change).toFixed(1)}m</span>`;
    }

    function priceArrow(change) {
      if (change > 0.05) return `<span class="price-arrow rising" title="Price rose £${change.toFixed(1)}m last GW">↑</span>`;
      if (change < -0.05) return `<span class="price-arrow falling" title="Price fell £${Math.abs(change).toFixed(1)}m last GW">↓</span>`;
      return '';
    }

    function netTransfersHtml(net) {
      if (!net || net === 0) return '';
      const abs = Math.abs(net);
      const label = abs >= 1000000 ? (abs / 1000000).toFixed(1) + 'M'
                  : abs >= 1000    ? Math.round(abs / 1000) + 'K'
                  : abs;
      if (net > 0) return `<span class="price-arrow rising" title="${net.toLocaleString()} net transfers in this GW — price may rise">↑ ${label}</span>`;
      return `<span class="price-arrow falling" title="${Math.abs(net).toLocaleString()} net transfers out this GW — price may fall">↓ ${label}</span>`;
    }

    function driversHtml(drivers) {
      if (!drivers || !drivers.length) return '';
      return drivers.map(d => {
        let cls = 'driver-tag';
        if (d === 'Injured / unavailable') cls += ' injury';
        else if (d === 'Doubtful') cls += ' doubtful';
        else if (d === 'Injury concern') cls += ' concern';
        return `<span class="${cls}">${d}</span>`;
      }).join('');
    }

    function pricePredictionHtml(riselikely, fallLikely) {
      if (riselikely) return `<span class="price-arrow rising" title="More than 1% of managers transferred this player in this GW — price likely to rise">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Likely rising</span>`;
      if (fallLikely) return `<span class="price-arrow falling" title="More than 1% of managers transferred this player out this GW — price likely to fall">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
        Likely falling</span>`;
      return '';
    }

    function hotFormHtml(hot) {
      if (!hot) return '';
      return `<span class="badge-hot-form" title="Recent 4-GW form at least 30% above season average">
        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        HOT FORM</span>`;
    }

    function ownershipTrendHtml(trend) {
      if (trend == null || Math.abs(trend) < 0.05) return '';
      if (trend > 0) return `<span class="ownership-trend rising" title="Ownership up ${trend.toFixed(1)}% since last GW">↑${trend.toFixed(1)}%</span>`;
      return `<span class="ownership-trend falling" title="Ownership down ${Math.abs(trend).toFixed(1)}% since last GW">↓${Math.abs(trend).toFixed(1)}%</span>`;
    }

    function breakEvenHtml(weeks) {
      if (weeks == null) return '';
      return `<span class="break-even" title="Points hit paid back after this many GWs of improvement">Breaks even in ${weeks} GW${weeks === 1 ? '' : 's'}</span>`;
    }

    const ROTATION_RISK_THRESHOLD = 0.35;

    function rotationRiskHtml(risk) {
      if (!risk || risk < ROTATION_RISK_THRESHOLD) return '';
      const pct = Math.round(risk * 100);
      return `<span class="badge-rotation" title="Averaged under ~60 min/game in recent GWs — rotation risk">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
        ROT ${pct}%
      </span>`;
    }

    function timingHtml(t) {
      if (!t || !t.wait_recommended) return '';
      const nd = typeof t.next_difficulty === 'number' ? t.next_difficulty.toFixed(2) : t.next_difficulty;
      return `<span class="tc-timing">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Tough next fixture (${nd} vs avg ${t.rest_avg_difficulty.toFixed(2)}) — consider waiting
      </span>`;
    }

    function renderCard(s, freePct) {
      const outColours = teamColours({ position: s.position, team_short_name: s.out_team_short_name });
      const inColours  = teamColours({ position: s.position, team_short_name: s.in_team_short_name });

      const costBadge = s.points_cost === 0
        ? `<span class="badge-free-lg">FREE</span>`
        : `<span class="badge-hit-lg">−${s.points_cost} pts</span>`;
      const dgwBadge  = s.in_dgw ? `<span class="badge-dgw">DGW</span>` : '';
      const diffBadge = s.is_differential ? `<span class="badge-diff">DIFF</span>` : '';
      const ownHtml   = s.in_ownership_pct != null
        ? `<span class="tc-ownership">${s.in_ownership_pct.toFixed(1)}% owned</span>` : '';
      const marginalHtml = s.is_marginal
        ? `<div style="margin-top:0.5rem;padding:0.4rem 0.6rem;background:var(--warning-bg,#fef3c7);border:1px solid var(--warning,#f59e0b);border-radius:var(--r-md);font-size:0.6875rem;font-weight:600;color:#92400e">
            ↩ Marginal gain — consider rolling this transfer to next gameweek instead
           </div>` : '';

      return `<div class="transfer-card">
        <div class="tc-header">
          ${FPL.posBadge(s.position)}
          <div style="display:flex;align-items:center;gap:0.4rem">${diffBadge}${dgwBadge}${costBadge}</div>
        </div>
        <div class="tc-players">
          <div class="tc-side">
            <div class="tc-shirt">${shirtSvg(outColours[0], outColours[1], abbr(s.out_web_name))}</div>
            <div class="tc-name">${s.out_web_name} ${priceArrow(s.out_price_last_gw_change ?? 0)}</div>
          </div>
          <div class="tc-arrow">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            <span class="tc-improvement">+${s.improvement.toFixed(2)} pts/GW</span>
          </div>
          <div class="tc-side">
            <div class="tc-shirt">${shirtSvg(inColours[0], inColours[1], abbr(s.in_web_name))}</div>
            <div class="tc-name">${s.in_web_name} ${priceArrow(s.in_price_last_gw_change ?? 0)} ${netTransfersHtml(s.in_net_transfers_this_gw)}</div>
            ${ownHtml}
            ${s.in_ownership_trend != null ? `<span style="font-size:0.5625rem;color:var(--text-muted);text-align:center">${ownershipTrendHtml(s.in_ownership_trend)} ownership</span>` : ''}
          </div>
        </div>
        <div class="tc-footer">
          ${driversHtml(s.improvement_drivers)}
          ${priceHtml(s.price_change)}
          ${pricePredictionHtml(s.in_price_rise_likely, s.in_price_fall_likely)}
          ${hotFormHtml(s.in_hot_form)}
          ${rotationRiskHtml(s.in_rotation_risk)}
          ${breakEvenHtml(s.break_even_weeks)}
          ${timingHtml(s.timing_signal)}
        </div>
        ${marginalHtml}
      </div>`;
    }

    async function run() {
      const btn = document.getElementById('run-btn');
      document.getElementById('results').style.display = 'none';
      FPL.clearError(); FPL.setLoading(true, btn);

      const entryId = document.getElementById('entry-id').value;
      const free    = document.getElementById('free-transfers').value;
      FPL.setEntryId(entryId);

      try {
        const data = await FPL.apiFetch(
          `/api/v1/suggest-transfers?entry_id=${entryId}&free_transfers=${free}`
        );

        const rollBanner = document.getElementById('roll-banner');
        const rollMsg    = document.getElementById('roll-message');
        if (data.roll_recommendation && data.roll_reason) {
          rollMsg.textContent = data.roll_reason;
          rollBanner.style.display = '';
        } else {
          rollBanner.style.display = 'none';
        }

        if (!data.suggestions.length) {
          document.getElementById('results').style.display = '';
          return;
        }

        document.getElementById('transfer-list').innerHTML = data.suggestions.map(s => renderCard(s, parseInt(free))).join('');
        document.getElementById('results').style.display = '';
      } catch (err) {
        FPL.showError(err.message);
      } finally {
        FPL.setLoading(false, btn);
      }
    }
  </script>
</body>
</html>
