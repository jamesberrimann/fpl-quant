<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Squad — FPL Tool</title>
  <link rel="stylesheet" href="/style.css?v=2">
  <style>
    .squad-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.875rem; color: var(--text-muted);
    }
    .squad-header strong { color: var(--text); }

    .pitch-outer { max-width: 460px; margin: 0 auto; }

    .pitch {
      position: relative;
      background: #2e7d46;
      background-image: repeating-linear-gradient(180deg,
        transparent, transparent 48px, rgba(0,0,0,.055) 48px, rgba(0,0,0,.055) 96px);
      border-radius: 10px; overflow: hidden; aspect-ratio: 2/3;
      box-shadow: var(--sh-lg);
    }
    .pitch-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .player-node {
      position: absolute; display: flex; flex-direction: column;
      align-items: center; transform: translate(-50%, -50%);
    }
    .shirt-wrap { position: relative; width: 34px; height: 37px; }
    .shirt-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

    .cap-dot {
      position: absolute; top: -4px; right: -6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #f59e0b; border: 2px solid #fff;
      font-size: 7px; font-weight: 800; color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .cap-dot.vc { background: #94a3b8; }

    .injury-dot {
      position: absolute; top: -4px; left: -6px;
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #fff;
      font-size: 8px; font-weight: 900; color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .injury-dot.out      { background: #dc2626; }
    .injury-dot.doubtful { background: #f97316; }
    .injury-dot.concern  { background: #eab308; color: #713f12; }

    .player-lbl {
      font-size: 0.5rem; font-weight: 700; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      white-space: nowrap; margin-top: 2px; text-transform: uppercase;
    }
    .player-price {
      font-size: 0.5rem; color: rgba(255,255,255,.75);
      text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap;
    }
    .fix-lbl {
      font-size: 0.4375rem; font-weight: 600;
      color: rgba(255,255,255,.65);
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      white-space: nowrap; margin-top: 1px;
    }
    .fix-lbl.dgw {
      color: #fbbf24;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .badge-diff {
      display: inline-flex; align-items: center;
      padding: 0.1rem 0.4rem; border-radius: 4px;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.04em;
      background: #fef3c7; color: #92400e;
    }
    .badge-factor {
      display: inline-flex; align-items: center;
      padding: 0.1rem 0.4rem; border-radius: 4px;
      font-size: 0.625rem; font-weight: 600;
      background: var(--surface); color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .bench-section { margin-top: 1.5rem; }
    .bench-row {
      display: flex; align-items: flex-start; justify-content: center;
      gap: 1.25rem; flex-wrap: wrap; padding: 1rem 1.25rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--sh-sm);
    }
    .bench-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bench-shirt { width: 32px; height: 35px; }
    .bench-shirt svg { width: 100%; height: 100%; opacity: .75; }
    .bench-lbl { font-size: 0.5625rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .bench-price { font-size: 0.5rem; color: var(--text-muted); white-space: nowrap; }
    .bench-fix { font-size: 0.4375rem; color: var(--text-muted); white-space: nowrap; }

    .perc-pill {
      font-size: 0.4375rem; font-weight: 700;
      padding: 1px 4px; border-radius: 3px;
      margin-top: 1px; white-space: nowrap; text-shadow: none;
    }
    .perc-high  { background: #16a34a; color: #fff; }
    .perc-mid   { background: #d97706; color: #fff; }
    .perc-low   { background: #dc2626; color: #fff; }

    .risk-dot {
      position: absolute; top: -3px; right: -5px;
      width: 12px; height: 12px; border-radius: 3px;
      background: #f59e0b; border: 1.5px solid #fff;
      font-size: 8px; font-weight: 900; color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; letter-spacing: -0.5px;
    }

    @media (max-width: 480px) {
      .pitch-outer { max-width: 100%; }
      .bench-shirt { width: 27px; height: 30px; }
    }
  </style>
</head>
<body>
  <script src="/nav.js"></script>
  <script src="/kits.js?v=5"></script>
  <div class="container">
    <h1>Best Squad</h1>

    <div class="controls">
      <label>Budget (£m)
        <input type="number" id="budget" value="100.0" step="0.5" min="0" style="width:100px">
      </label>
      <button id="run-btn" onclick="run()">Best Squad</button>
      <button id="sens-btn" onclick="runSensitivity()" style="margin-left:0.5rem">Budget Sensitivity</button>
    </div>
    <div id="sensitivity-results" style="display:none;margin-top:1rem"></div>

    <p class="msg msg-error" id="error"></p>
    <div class="loading" id="loading"><div class="spinner"></div>Optimizing — this may take a few seconds…</div>

    <div id="results" style="display:none">
      <div class="squad-header">
        <span id="summary"></span>
        <span id="cap-summary"></span>
      </div>
      <div class="pitch-outer">
        <div class="pitch" id="pitch"></div>
      </div>
      <div class="bench-section">
        <h2>Bench</h2>
        <div class="bench-row" id="bench-row"></div>
      </div>

      <div style="margin-top:1rem;padding:0.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);font-size:0.75rem;color:var(--text-muted)">
        <div style="font-weight:700;margin-bottom:0.4rem;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.06em">Legend</div>
        <div style="display:flex;flex-wrap:wrap;gap:0.6rem 1.25rem;align-items:center">
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#f59e0b;color:#fff;font-size:6px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">C</span>Captain</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#94a3b8;color:#fff;font-size:6px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">V</span>Vice-captain</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#dc2626;color:#fff;font-size:7px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">!</span>Injured / suspended</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#f97316;color:#fff;font-size:7px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">!</span>Doubtful (&lt;75%)</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#eab308;color:#713f12;font-size:7px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">!</span>Slight concern (75–99%)</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#fbbf24;color:#fff;font-size:6px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">DGW</span>Double gameweek fixture</span>
          <span><span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:3px;background:#f59e0b;color:#fff;font-size:8px;font-weight:900;border:1.5px solid #e5e7eb;margin-right:4px">~</span>Fixture dependent</span>
        </div>
      </div>

      <div id="squad-rating-card" style="margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:0.875rem 1.25rem;box-shadow:var(--sh-sm)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.625rem">
          <div style="font-size:0.8125rem;color:var(--text-muted);font-weight:500">Squad Rating</div>
          <div style="display:flex;align-items:baseline;gap:4px">
            <span id="squad-rating-value" style="font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums"></span>
            <span style="font-size:0.875rem;color:var(--text-muted);font-weight:500">/100</span>
          </div>
        </div>
        <div id="squad-rating-summary" style="font-size:0.8125rem;color:var(--text-muted);line-height:1.55;border-top:1px solid var(--border);padding-top:0.625rem"></div>
      </div>
    </div>
  </div>

  <script>
    const ROW_Y = { GKP: 12, DEF: 33, MID: 56, FWD: 81 };
    const { teamColours, abbr, shirtSvg, spreadX, PITCH_SVG } = FPLKits;

    function percClass(p) {
      if (p >= 75) return 'perc-high';
      if (p >= 40) return 'perc-mid';
      return 'perc-low';
    }

    function injuryBadge(player) {
      const s = player.status || 'a';
      const chance = player.chance_of_playing_next_round;
      if (s === 'i' || s === 's' || s === 'u' || chance === 0)
        return `<span class="injury-dot out" title="${s === 's' ? 'Suspended' : 'Injured / unavailable'}">!</span>`;
      if (s === 'd' || (chance != null && chance < 75))
        return `<span class="injury-dot doubtful" title="Doubtful${chance != null ? ' (' + chance + '%)' : ''}">!</span>`;
      if (chance != null && chance < 100)
        return `<span class="injury-dot concern" title="${chance}% chance of playing">!</span>`;
      return '';
    }

    function placePlayer(player, captainId, vcId) {
      const [fill, stroke] = teamColours(player);
      const node = document.createElement('div');
      node.className = 'player-node';
      node.style.left = player._x + '%';
      node.style.top  = player._y + '%';
      let capBadge = '';
      if (player.id === captainId)     capBadge = '<span class="cap-dot" aria-label="Captain">C</span>';
      else if (player.id === vcId)     capBadge = '<span class="cap-dot vc" aria-label="Vice-captain">V</span>';
      const isDgw = player.next_fixture && player.next_fixture.includes('DGW');
      const fix = player.next_fixture
        ? `<div class="fix-lbl${isDgw ? ' dgw' : ''}">${player.next_fixture}</div>` : '';
      const pct = Math.round(player.percentile || 0);
      const riskBadge = player.flag ? `<span class="risk-dot" title="${player.flag}">~</span>` : '';
      node.innerHTML = `
        <div class="shirt-wrap">${shirtSvg(fill, stroke, abbr(player.web_name))}${capBadge}${injuryBadge(player)}${riskBadge}</div>
        <div class="player-lbl">${player.web_name}</div>
        <div class="player-price">£${player.price.toFixed(1)}m</div>
        <div class="perc-pill ${percClass(pct)}">${pct}th</div>
        ${fix}`;
      document.getElementById('pitch').appendChild(node);
    }

    function benchHtml(player) {
      const [fill, stroke] = teamColours(player);
      const fix   = player.next_fixture ? `<div class="bench-fix">${player.next_fixture}</div>` : '';
      const pct = Math.round(player.percentile || 0);
      const riskBadge = player.flag ? `<span class="risk-dot" title="${player.flag}">~</span>` : '';
      return `<div class="bench-item">
        <div class="bench-shirt" style="position:relative">${shirtSvg(fill, stroke, abbr(player.web_name))}${injuryBadge(player)}${riskBadge}</div>
        <div class="bench-lbl">${player.web_name}</div>
        <div class="bench-price">£${player.price.toFixed(1)}m</div>
        <div class="perc-pill ${percClass(pct)}" style="font-size:0.4rem">${pct}th</div>
        ${fix}
      </div>`;
    }

    function generateRatingSummary(data) {
      const allPlayers = [...data.starting_xi, ...data.bench];
      const score = data.squad_score_percentile;
      const byPos = {};
      for (const p of allPlayers) {
        if (!byPos[p.position]) byPos[p.position] = [];
        byPos[p.position].push(p.percentile);
      }
      const posAvg = Object.fromEntries(
        Object.entries(byPos).map(([pos, arr]) => [pos, arr.reduce((a,b)=>a+b,0)/arr.length])
      );
      const posLabel = { GKP: 'goalkeeping', DEF: 'defence', MID: 'midfield', FWD: 'attack' };
      const sorted = Object.entries(posAvg).sort((a,b) => b[1]-a[1]);
      const [bestPos, bestAvg] = sorted[0];
      const [worstPos, worstAvg] = sorted[sorted.length-1];
      const high = allPlayers.filter(p => p.percentile >= 75).length;
      const low  = allPlayers.filter(p => p.percentile < 35).length;
      const risks = allPlayers.filter(p => p.flag);

      let tier;
      if      (score >= 75) tier = 'a strong squad — most players sit well above the median starter';
      else if (score >= 55) tier = 'a solid squad with a few areas to improve';
      else if (score >= 40) tier = 'an average squad — meaningful upgrades exist';
      else                  tier = 'a squad that needs attention — several positions are well below average';

      let html = `<p>At <strong>${score.toFixed(1)}/100</strong> (where 50 = median squad of regular starters), this is ${tier}.</p>`;
      html += `<p>Strongest area: <strong>${posLabel[bestPos]}</strong> (avg ${Math.round(bestAvg)}th percentile).`;
      if (worstAvg < 60) {
        html += ` Weakest: <strong>${posLabel[worstPos]}</strong> (avg ${Math.round(worstAvg)}th percentile) — consider upgrades here.`;
      } else {
        html += ` All positions are above average — <strong>${posLabel[worstPos]}</strong> is the least dominant at ${Math.round(worstAvg)}th percentile but still strong.`;
      }
      html += `</p>`;
      if (high > 0 || low > 0) {
        html += `<p><strong>${high} player${high !== 1 ? 's' : ''}</strong> in the top 25%; <strong>${low}</strong> in the bottom 35%.</p>`;
      }
      if (risks.length > 0) {
        html += `<p style="color:var(--warning)">Fixture dependent: <strong>${risks.map(p => p.web_name).join(', ')}</strong> — strong output not backed by underlying defensive numbers.</p>`;
      }
      return html;
    }

    async function run() {
      const btn = document.getElementById('run-btn');
      document.getElementById('results').style.display = 'none';
      FPL.clearError(); FPL.setLoading(true, btn);
      document.querySelectorAll('#pitch .player-node').forEach(n => n.remove());
      document.getElementById('pitch').innerHTML = PITCH_SVG;

      const budget = document.getElementById('budget').value;

      try {
        const data = await FPL.apiFetch(`/api/v1/optimize-squad?budget=${budget}`);

        // Place starting XI on pitch
        const groups = { GKP: [], DEF: [], MID: [], FWD: [] };
        for (const p of data.starting_xi) groups[p.position].push(p);

        for (const [pos, players] of Object.entries(groups)) {
          players.sort((a, b) => b.score - a.score);
          players.forEach((p, i) => {
            p._x = spreadX(players.length, i);
            p._y = ROW_Y[pos];
            placePlayer(p, data.captain_id, data.vice_captain_id);
          });
        }

        // Bench
        document.getElementById('bench-row').innerHTML = data.bench.map(benchHtml).join('');

        const def = groups.DEF.length, mid = groups.MID.length, fwd = groups.FWD.length;
        document.getElementById('summary').innerHTML =
          `<strong>${def}–${mid}–${fwd}</strong> · `+
          `Total cost <strong>£${data.total_cost.toFixed(1)}m</strong> · `+
          `Avg <strong>${data.squad_score.toFixed(2)} pts/gw</strong>`;

        // Captain/VC ownership summary
        const capOwn = data.captain_ownership_pct;
        const vcOwn  = data.vc_ownership_pct;
        const capPlayer = data.starting_xi.find(p => p.id === data.captain_id);
        const vcPlayer  = data.starting_xi.find(p => p.id === data.vice_captain_id);
        const factorTags = fs => fs && fs.length
          ? ' ' + fs.map(f => `<span class="badge-factor">${f}</span>`).join(' ') : '';

        let capSummary = '';
        if (capPlayer) {
          const diff = capOwn != null && capOwn < 15 ? ' <span class="badge-diff">DIFF</span>' : '';
          const own  = capOwn != null ? ` ${capOwn.toFixed(1)}%` : '';
          capSummary += `C: <strong>${capPlayer.web_name}</strong>${own}${diff}${factorTags(data.captain_top_factors)}`;
        }
        if (vcPlayer) {
          const diff = vcOwn != null && vcOwn < 15 ? ' <span class="badge-diff">DIFF</span>' : '';
          const own  = vcOwn != null ? ` ${vcOwn.toFixed(1)}%` : '';
          capSummary += (capSummary ? ' &nbsp;·&nbsp; ' : '') +
            `VC: <strong>${vcPlayer.web_name}</strong>${own}${diff}${factorTags(data.vc_top_factors)}`;
        }
        document.getElementById('cap-summary').innerHTML = capSummary;
        // Squad rating
        const sqPct = data.squad_score_percentile;
        if (sqPct != null) {
          const valEl = document.getElementById('squad-rating-value');
          valEl.textContent = sqPct.toFixed(1);
          valEl.style.color = sqPct >= 70 ? 'var(--success)' : sqPct >= 45 ? '#d97706' : 'var(--error)';
          document.getElementById('squad-rating-summary').innerHTML = generateRatingSummary(data);
        }

        document.getElementById('results').style.display = '';
      } catch (err) {
        FPL.showError(err.message);
      } finally {
        FPL.setLoading(false, btn);
      }
    }

    async function runSensitivity() {
      const btn = document.getElementById('sens-btn');
      const sensEl = document.getElementById('sensitivity-results');
      sensEl.style.display = 'none';
      FPL.clearError(); btn.disabled = true; btn.textContent = 'Calculating…';

      const budget = document.getElementById('budget').value;

      try {
        const data = await FPL.apiFetch(`/api/v1/budget-sensitivity?budget=${budget}&steps=4`);

        const rows = data.steps.map((s, i) => {
          const gain = s.marginal_gain != null
            ? `<span style="color:var(--success);font-weight:600">+${s.marginal_gain.toFixed(3)} pts/GW</span>`
            : '<span style="color:var(--text-muted)">baseline</span>';
          return `<tr>
            <td>£${s.budget.toFixed(1)}m</td>
            <td>${s.squad_score.toFixed(3)}</td>
            <td>${gain}</td>
            <td style="color:var(--text-muted)">£${s.total_cost.toFixed(1)}m</td>
          </tr>`;
        }).join('');

        sensEl.innerHTML = `
          <h3 style="margin:0 0 0.5rem;font-size:0.9375rem">Budget sensitivity (£0.5m steps)</h3>
          <table style="width:100%;border-collapse:collapse;font-size:0.8125rem">
            <thead><tr style="font-size:0.6875rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">
              <th style="padding:0.3rem 0.5rem;text-align:left">Budget</th>
              <th style="padding:0.3rem 0.5rem;text-align:left">Avg score</th>
              <th style="padding:0.3rem 0.5rem;text-align:left">Gain vs prev</th>
              <th style="padding:0.3rem 0.5rem;text-align:left">Total cost</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
        sensEl.style.display = '';
      } catch (err) {
        FPL.showError(err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Budget Sensitivity';
      }
    }
  </script>
</body>
</html>
