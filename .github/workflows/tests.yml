name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fpl_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fpl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CBC solver
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://fpl_user:changeme@localhost:5432/fpl_db
          DATABASE_URL_SYNC: postgresql+psycopg2://fpl_user:changeme@localhost:5432/fpl_db
          FPL_API_BASE_URL: https://fantasy.premierleague.com/api
          API_KEY: ci-test-key
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://fpl_user:changeme@localhost:5432/fpl_db
          DATABASE_URL_SYNC: postgresql+psycopg2://fpl_user:changeme@localhost:5432/fpl_db
          FPL_API_BASE_URL: https://fantasy.premierleague.com/api
          API_KEY: ci-test-key
        run: pytest tests/ -v

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
